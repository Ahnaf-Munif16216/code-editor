<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Code Editor</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Code Editor</h1>
        <p>Write your HTML, CSS, and JavaScript code, and see the live result below!</p>
    </header>
    <main>
        <div id="editor-container">
            <textarea id="htmlEditor" placeholder="Write HTML here..."></textarea>
            <textarea id="cssEditor" placeholder="Write CSS here..."></textarea>
            <textarea id="jsEditor" placeholder="Write JavaScript here..."></textarea>
        </div>
        <button id="runCode">Run Code</button>
        <iframe id="outputFrame"></iframe>
    </main>
    <footer>
        <p>&copy; 2025 Code Editor</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
